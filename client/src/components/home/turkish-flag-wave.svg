<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <defs>
    <filter id="wave" x="-10%" y="-25%" width="120%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .025" numOctaves="1" seed="7" result="cloth">
        <animate attributeName="baseFrequency" values=".012 .025;.018 .035;.012 .025" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="cloth" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="red">
      <stop stop-color="#c4091b"/>
      <stop offset=".32" stop-color="#ee152b"/>
      <stop offset=".6" stop-color="#bd0617"/>
      <stop offset="1" stop-color="#e30a17"/>
    </linearGradient>
    <linearGradient id="light">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".24"/>
      <stop offset=".65" stop-color="#000" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="120" fill="url(#red)"/>
  <g filter="url(#wave)">
    <path fill="#fff" fill-rule="evenodd" d="M126 60a39 39 0 1 1-78 0 39 39 0 0 1 78 0Zm-2-5a31 31 0 1 0-62 0 31 31 0 0 0 62 0Z"/>
    <path fill="#fff" d="m157 36 7.5 16 17.5 2-13 12 3.5 17-15.5-9-15.5 9 3.5-17-13-12 17.5-2Z"/>
    <path fill="#fff" fill-rule="evenodd" d="M366 60a39 39 0 1 1-78 0 39 39 0 0 1 78 0Zm-2-5a31 31 0 1 0-62 0 31 31 0 0 0 62 0Z"/>
    <path fill="#fff" d="m397 36 7.5 16 17.5 2-13 12 3.5 17-15.5-9-15.5 9 3.5-17-13-12 17.5-2Z"/>
  </g>
  <rect x="-480" width="960" height="120" fill="url(#light)" opacity=".8">
    <animate attributeName="x" values="-480;0;-480" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
